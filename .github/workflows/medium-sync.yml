name: Prepare Medium article sync

on:
  push:
    branches:
      - main
    paths:
      - "Programmierangebote fuer Kinder und Jugendliche.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Validate article and prepare package
        run: python3 scripts/prepare_medium_sync.py

      - name: Upload Medium sync package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: medium-sync-package
          path: medium-sync-output/
          if-no-files-found: error
          retention-days: 14
